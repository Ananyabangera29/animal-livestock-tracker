<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Animal Management</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 30px auto;
        }

        h1 {
            text-align: center;
        }

        .nav {
            text-align: center;
            margin-bottom: 25px;
        }

        .nav a {
            display: inline-block;
            text-decoration: none;
            margin: 5px;
            padding: 10px 15px;
            background-color: #333;
            color: white;
            border-radius: 6px;
        }

        .nav a:hover {
            background-color: #555;
        }

        .card {
            background-color: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        input {
            padding: 10px;
            margin: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background-color: #333;
            color: white;
        }

        button:hover {
            background-color: #555;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #eeeeee;
        }

        .delete {
            background-color: #c62828;
        }

        .delete:hover {
            background-color: #a51f1f;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🐄 Animal Management</h1>

        <div class="nav">
            <a href="/">🏠 Dashboard</a>
            <a href="/animals">🐄 Animals</a>
            <a href="/income">💰 Income</a>
            <a href="/expenses">💸 Expenses</a>
            <a href="/reports">📊 Reports</a>
        </div>

        <div class="card">

            <h2>Add Animal</h2>

            <form action="/animals/add" method="POST">

                <input
                    type="text"
                    name="animal_type"
                    placeholder="Animal Type"
                    required
                >

                <input
                    type="text"
                    name="breed"
                    placeholder="Breed"
                    required
                >

                <input
                    type="number"
                    name="age"
                    placeholder="Age"
                    required
                >

                <input
                    type="number"
                    name="quantity"
                    placeholder="Quantity"
                    required
                >

                <button type="submit">
                    Add Animal
                </button>

            </form>

        </div>

        <div class="card">

            <h2>Animal Records</h2>

            <table>

                <tr>
                    <th>ID</th>
                    <th>Animal Type</th>
                    <th>Breed</th>
                    <th>Age</th>
                    <th>Quantity</th>
                    <th>Action</th>
                </tr>

                {% for animal in animals %}

                <tr>

                    <td>{{ animal.id }}</td>

                    <td>{{ animal.animal_type }}</td>

                    <td>{{ animal.breed }}</td>

                    <td>{{ animal.age }}</td>

                    <td>{{ animal.quantity }}</td>

                     <td>
    <a href="/animals/edit/{{ animal.id }}">
        <button type="button">Edit</button>
    </a>

    <form action="/animals/delete/{{ animal.id }}" method="POST" style="display:inline;">
        <button type="submit" class="delete" onclick="return confirm('Are you sure you want to delete this animal?')">
            Delete
        </button>
    </form>
</td>

                </tr>

                {% endfor %}

            </table>

        </div>

    </div>

</body>

</html>
